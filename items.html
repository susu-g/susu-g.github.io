<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Shabu Meat House</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Shabu <span>Meat House</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="items.html">Shop</a></li>
    <li><a href="recipes.html">Recipes</a></li>
  </ul>
</nav>

<section class="container">
  <p class="section-label">Order Prep / 订单准备</p>
  <h1 class="section-title">Full Catalogue</h1>

  <div style="display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
    <input type="text" id="searchInput" placeholder="Search products (English or 中文)..." onkeyup="filterProducts()" style="padding: 12px 20px; border-radius: 50px; border: 1px solid var(--border); flex: 1; min-width: 250px;">
    <button onclick="toggleGuide()" class="btn-secondary" style="width: auto; border: 1.5px solid var(--blue-accent); color: var(--blue-accent); background: none; padding: 0 1.5rem; border-radius: 50px; cursor: pointer;">How much to buy?</button>
  </div>

  <div id="shopGuide" style="display: none; background: var(--blue-light); padding: 2rem; border-radius: 20px; margin-bottom: 2rem;">
    <h3>Recommended per person:</h3>
    <p>• Meat: 0.5lb - 0.75lb<br>• Veggies: 1.5 portions<br>• Soup: 1 base per 3-4 people</p>
  </div>

  <div class="products-grid" id="productsGrid"></div>
</section>

<div class="floating-cart" onclick="toggleDrawer()">
  🛒 View My List (<span id="cartCount">0</span>)
</div>

<div id="list-drawer">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2 style="font-family: 'Playfair Display';">My Order</h2>
        <button onclick="toggleDrawer()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">✕</button>
    </div>
    <div id="cartItems"></div>
    <div style="border-top: 1px solid var(--border); margin-top: 2rem; padding-top: 1rem;">
        <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; margin-bottom: 1.5rem;">
            <span>Total Estimated:</span>
            <span id="cartTotal">$0.00</span>
        </div>
        <button class="btn-primary" onclick="copyForWeChat()">Copy for WeChat (复制订单)</button>
        <button class="btn-primary" onclick="window.print()" style="background: var(--ink-soft); margin-top: 10px;">Print List</button>
        <button onclick="clearCart()" style="display: block; width: 100%; background: none; border: none; color: #999; margin-top: 20px; cursor: pointer;">Clear List</button>
    </div>
</div>

<script>
    const products = [
        { id: 1, name: "Australia Lamb Shoulder Rolls", zh: "澳大利亚羊肉卷", price: 13.99, unit: "lb", cat: "lamb" },
        { id: 2, name: "Beef Short Plate Rolls", zh: "牛五花卷", price: 12.99, unit: "lb", cat: "beef" },
        { id: 3, name: "Little Sheep Mala Soup Base", zh: "小肥羊麻辣底料", price: 5.90, unit: "ea", cat: "soup" }
        // ... paste the rest of your products here ...
    ];

    let cart = JSON.parse(localStorage.getItem('shabuCart')) || {};

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = products.map(p => `
            <div class="product-card">
                <div class="product-name">${p.name}</div>
                <div class="product-zh">${p.zh}</div>
                <div class="product-price">$${p.price.toFixed(2)} / ${p.unit}</div>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="updateQty(${p.id}, -1)">-</button>
                    <span class="qty-val" id="qty-${p.id}">${cart[p.id]?.qty || 0}</span>
                    <button class="qty-btn" onclick="updateQty(${p.id}, 1)">+</button>
                </div>
            </div>
        `).join('');
    }

    function updateQty(id, change) {
        const product = products.find(p => p.id === id);
        if (!cart[id]) cart[id] = { ...product, qty: 0 };
        
        cart[id].qty += change;
        if (cart[id].qty <= 0) delete cart[id];
        
        localStorage.setItem('shabuCart', JSON.stringify(cart));
        updateUI();
    }

    function updateUI() {
        renderProducts();
        const cartItems = document.getElementById('cartItems');
        const cartCount = document.getElementById('cartCount');
        const cartTotal = document.getElementById('cartTotal');
        
        let total = 0;
        let count = 0;
        cartItems.innerHTML = '';

        Object.values(cart).forEach(item => {
            total += item.price * item.qty;
            count += item.qty;
            cartItems.innerHTML += `
                <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                    <span>${item.qty}x ${item.name}</span>
                    <span>$${(item.price * item.qty).toFixed(2)}</span>
                </div>
            `;
        });

        cartCount.innerText = count;
        cartTotal.innerText = `$${total.toFixed(2)}`;
    }

    function copyForWeChat() {
        let text = "Shabu Meat House Order 订单:\n";
        Object.values(cart).forEach(item => {
            text += `• ${item.qty}x ${item.name} ${item.zh}\n`;
        });
        text += `\nTotal: ${document.getElementById('cartTotal').innerText}\nWeChat: shabumeat`;
        navigator.clipboard.writeText(text).then(() => alert("Copied! Paste into WeChat."));
    }

    function toggleDrawer() { document.getElementById('list-drawer').classList.toggle('active'); }
    function toggleGuide() { 
        const g = document.getElementById('shopGuide');
        g.style.display = g.style.display === 'none' ? 'block' : 'none';
    }
    function clearCart() { cart = {}; localStorage.removeItem('shabuCart'); updateUI(); }

    window.onload = updateUI;
</script>

</body>
</html>
