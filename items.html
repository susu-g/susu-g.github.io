        { name: "Kikkoman Premium Soy Sauce 750ml", zh: "龟甲万特选大豆酱油", price: 8.00, unit: "per ea", cat: "condiments" },
        { name: "Kimlan Vinegar", zh: "金兰醋", price: 6.00, unit: "per ea", cat: "condiments" },

        { name: "JoyShare Pure Sesame Paste", zh: "乐享纯芝麻酱", price: 6.99, unit: "per ea", cat: "condiments" },
        // DIPPING
        { name: "Little Sheep Dipping Sauce – Original", zh: "小肥羊蘸料盒装-清香", price: 2.00, unit: "per ea", cat: "dipping" },
        { name: "Little Sheep Dipping Sauce – Spicy", zh: "小肥羊蘸料盒装-香辣", price: 2.00, unit: "per ea", cat: "dipping" },
        { name: "XIAOLONGKAN Sesame Dip – Original", zh: "小龙坎火锅麻酱原味", price: 1.90, unit: "per ea", cat: "dipping" },
        { name: "XIAOLONGKAN Sesame Dip – Spicy", zh: "小龙坎火锅麻酱香辣", price: 1.90, unit: "per ea", cat: "dipping" }
    ];

    let cart = JSON.parse(localStorage.getItem('shabuCart')) || {};
    let currentCat = 'all';

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        
        const filtered = products.filter(p => {
            const matchesSearch = p.name.toLowerCase().includes(searchTerm) || (p.zh && p.zh.includes(searchTerm));
            const matchesCat = currentCat === 'all' || p.cat === currentCat;
            return matchesSearch && matchesCat;
        });

        grid.innerHTML = filtered.map(p => {
            // Find its position in the master list so quotes in names like Ben & Jerry's don't break the JS
            const originalIndex = products.findIndex(orig => orig.name === p.name);
            
            // Safety net: forces a fallback number if you accidentally pass strings later on
            const priceValue = typeof p.price === 'number' ? p.price : parseFloat(String(p.price).replace(/[^0-9.]/g, '')) || 0;
            const priceDisplay = typeof p.price === 'number' ? `$${p.price.toFixed(2)}` : p.price;
            
            return `
                <div class="product-card">
                    <div class="product-name">${p.name}</div>
                    <div class="product-zh">${p.zh || ''}</div>
                    <div class="product-price">${priceDisplay} / ${p.unit || ''}</div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty(${originalIndex}, -1)">-</button>
                        <span class="qty-val" id="qty-${p.name.replace(/[^a-zA-Z0-9]/g, '')}">${cart[p.name]?.qty || 0}</span>
                        <button class="qty-btn" onclick="updateQty(${originalIndex}, 1)">+</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterByCat(cat) {
        currentCat = cat;
        renderProducts();
    }

    function updateQty(index, change) {
        const product = products[index];
        const name = product.name;
        if (!cart[name]) cart[name] = { ...product, qty: 0 };
        
        cart[name].qty += change;
        if (cart[name].qty <= 0) delete cart[name];
        
        localStorage.setItem('shabuCart', JSON.stringify(cart));
        updateUI();
    }

    function updateUI() {
        renderProducts();
        const cartItems = document.getElementById('cartItems');
        const cartCount = document.getElementById('cartCount');
        const cartTotal = document.getElementById('cartTotal');
        
        let total = 0;
        let count = 0;
        cartItems.innerHTML = '';

        Object.values(cart).forEach(item => {
            const priceValue = typeof item.price === 'number' ? item.price : parseFloat(String(item.price).replace(/[^0-9.]/g, '')) || 0;
            total += priceValue * item.qty;
            count += item.qty;
            cartItems.innerHTML += `
                <div style="display:flex; justify-content:space-between; margin-bottom:1rem; font-size: 0.9rem;">
                    <span><strong>${item.qty}x</strong> ${item.name}</span>
                    <span>$${(priceValue * item.qty).toFixed(2)}</span>
                </div>
            `;
        });

        cartCount.innerText = count;
        cartTotal.innerText = `$${total.toFixed(2)}`;
    }

    function copyForWeChat() {
        if (Object.keys(cart).length === 0) return alert("Your list is empty!");
        let text = "Shabu Meat House Order 订单:\n---\n";
        Object.values(cart).forEach(item => {
            text += `${item.qty}x ${item.name} ${item.zh}\n`;
        });
        text += `\nTotal: ${document.getElementById('cartTotal').innerText}\nWeChat: shabumeat`;
        text += "⚠️ Note to Viewer:\n";
        text += "This is an inquiry list from the website. Please confirm availability and final weight for 'per lb' items in-store.";
        navigator.clipboard.writeText(text).then(() => alert("List copied! Now paste it into WeChat."));
    }

    function toggleDrawer() { document.getElementById('list-drawer').classList.toggle('active'); }
    function clearCart() { if(confirm("Clear list?")) { cart = {}; localStorage.removeItem('shabuCart'); updateUI(); } }

    window.onload = updateUI;
</script>
