// ─── RENDER ─────────────────────────────────────────────────────────────────
function renderRecipes() {
  const grid = document.getElementById('recipesGrid');
  const filtered = activeFilter === 'all' ? recipes : recipes.filter(r => r.tags.includes(activeFilter));

  grid.innerHTML = filtered.map(r => {
    const isEn = lang === 'en';
    const primary = t => `<span style="font-weight:700;font-size:1em;">${t[lang]}</span>`;
    const secondary = t => `<span style="font-weight:400;opacity:0.65;font-size:0.88em;display:block;font-family:'Noto Sans SC',sans-serif;">${t[lang === 'en' ? 'zh' : 'en']}</span>`;
    return `
      <div class="recipe-card" onclick="openRecipe(${r.id})">
        <div class="recipe-header">
          <span class="recipe-meta">${r.meta[lang]}</span>
          <div class="recipe-title-en" style="font-size:1.1rem;">${r.emoji} ${primary(r.title)}</div>
          <div class="recipe-title-zh">${secondary(r.title)}</div>
        </div>
        <div class="recipe-content" style="border-top:1px solid #f0f4f7;padding-top:1rem;margin-bottom:1rem;flex:1;">
          <p style="font-size:0.88rem;color:var(--ink-soft);line-height:1.6;">${r.desc[lang]}</p>
          <p style="font-size:0.8rem;color:var(--ink-soft);margin-top:0.5rem;font-family:'Noto Sans SC',sans-serif;opacity:0.7;">${r.desc[lang === 'en' ? 'zh' : 'en']}</p>
        </div>
        <button class="btn-add-recipe" onclick="event.stopPropagation();openRecipe(${r.id})">
          ${isEn ? 'View Recipe & Add to List' : '查看食谱并添加到清单'} →
        </button>
      </div>`;
  }).join('');
}

function openRecipe(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  const isEn = lang === 'en';
  const box = document.getElementById('recipeModalBox');

  const shabuRows = r.shabuIngredients.map(i =>
    `<div class="ingredient-row shabu">
      <span>✓ <strong>${i.en}</strong> <span class="ing-zh">${i.zh}</span></span>
      <span>${i.amount}</span>
    </div>`).join('');

  const otherRows = r.otherIngredients.map(i =>
    `<div class="ingredient-row other">
      <span>${i.en} <span class="ing-zh">${i.zh}</span></span>
      <span>${i.amount}</span>
    </div>`).join('');

  const stepItems = r.steps.map(s =>
    `<li class="step-item">
      <div class="step-num"></div>
      <div class="step-text">${s[lang]}<span class="zh">${s[lang === 'en' ? 'zh' : 'en']}</span></div>
    </li>`).join('');

  box.innerHTML = `
    <div class="recipe-modal-head">
      <button class="recipe-modal-close" onclick="closeRecipe()">×</button>
      <h2>${r.emoji} ${r.title[lang]}</h2>
      <div class="zh" style="font-family:'Noto Sans SC',sans-serif;color:var(--blue-deep);font-size:0.95rem;">${r.title[lang === 'en' ? 'zh' : 'en']}</div>
    </div>
    <div class="recipe-modal-body">
      <p class="ingredient-section-title shabu">✓ ${isEn ? 'Available at Shabu Meat House' : '涮肉屋有售'}</p>
      ${shabuRows}
      ${r.otherIngredients.length ? `<p class="ingredient-section-title other">${isEn ? 'Other ingredients needed' : '其他所需食材'}</p>${otherRows}` : ''}
      <p class="ingredient-section-title" style="color:var(--ink);margin-top:1.5rem;">${isEn ? '📝 Instructions' : '📝 步骤'}</p>
      <ul class="steps-list">${stepItems}</ul>
    </div>
    <div class="recipe-modal-foot">
      <button class="btn-add-shabu" onclick="addShabuToCart(${id})">
        🛒 ${isEn ? 'Add Shabu Items to My List' : '添加涮肉屋食材到清单'}
      </button>
      <button class="btn-copy-recipe" onclick="copyRecipe(${id})">
        📋 ${isEn ? 'Copy Full Recipe' : '复制完整食谱'}
      </button>
    </div>`;

  document.getElementById('recipeModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeRecipe() {
  document.getElementById('recipeModal').classList.remove('active');
  document.body.style.overflow = '';
}

function closeModalIfOverlay(e) {
  if (e.target.id === 'recipeModal') closeRecipe();
}

function addShabuToCart(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  let cart = JSON.parse(localStorage.getItem('shabuCart')) || {};
  r.shabuIngredients.forEach(ing => {
    const key = ing.key;
    if (!cart[key]) {
      cart[key] = { name: ing.en, zh: ing.zh, qty: 1, price: 0, unit: '', key, sizeLabel: '' };
    } else {
      cart[key].qty += 1;
    }
  });
  localStorage.setItem('shabuCart', JSON.stringify(cart));
  const isEn = lang === 'en';
  alert(isEn
    ? `✅ ${r.shabuIngredients.length} items added to your shopping list!\nView your list on the Shop page.`
    : `✅ ${r.shabuIngredients.length} 件商品已添加到购物清单！\n在商品页查看您的清单。`);
}

function copyRecipe(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  let text = `${r.title.en} / ${r.title.zh}\n${r.meta.en}\n\n`;
  text += `Ingredients from Shabu Meat House 涮肉屋食材:\n`;
  r.shabuIngredients.forEach(i => { text += `- ${i.amount} ${i.en} ${i.zh}\n`; });
  if (r.otherIngredients.length) {
    text += `\nOther ingredients 其他食材:\n`;
    r.otherIngredients.forEach(i => { text += `- ${i.amount} ${i.en} ${i.zh}\n`; });
  }
  text += `\nInstructions 步骤:\n`;
  r.steps.forEach((s, i) => { text += `${i+1}. ${s.en}\n   ${s.zh}\n`; });
  text += `\n— From Shabu Meat House Recipes | WeChat: shabumeat`;
  navigator.clipboard.writeText(text).then(() => {
    alert(lang === 'en' ? '✅ Recipe copied to clipboard!' : '✅ 食谱已复制到剪贴板！');
  });
}

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderRecipes();
}

function filterRecipes(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRecipes();
}

renderRecipes();
</script>
</body>
</html>
